name: Release Tabby Desktop for Windows

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.2.21

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies and build desktop app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop-build.txt
          pyinstaller --noconfirm --clean --onedir --windowed --name TabbyDesktop --icon "assets/tabby-logo.ico" --add-data "assets;assets" --add-data "index.html;." --add-data "game_client;game_client" --paths game_client --collect-all keyring --collect-all eth_account --collect-all cryptography --collect-all PySide6.QtWebEngineCore --collect-all PySide6.QtWebEngineWidgets desktop.py
          Compress-Archive -Path dist/TabbyDesktop -DestinationPath dist/TabbyDesktop-windows-x64.zip
      - name: Publish release with desktop application
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$env:RELEASE_TAG" dist/TabbyDesktop-windows-x64.zip --target "$env:GITHUB_SHA" --title "Tabby Desktop $env:RELEASE_TAG" --notes-file UPDATE-20261030-LISTING.md
