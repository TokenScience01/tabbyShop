name: Release Windows exe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies and build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          pyinstaller --noconfirm --clean --onefile --name TabbyShop --add-data "index.html;." --collect-all keyring --collect-all eth_account server.py
      - name: Publish release with executable
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$env:RELEASE_TAG" dist/TabbyShop.exe --title "Tabby Shop $env:RELEASE_TAG" --notes-file README-WINDOWS.md
